[package]
name = "rungbot"
description = "Crypto trading ladder for spot markets: dip-buy and take-profit rungs across Binance, Gate.io and Revolut X. Notify-only, holds no API keys."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["crypto", "trading-bot", "dca", "binance", "cli"]
categories = ["finance", "command-line-utilities"]
documentation = "https://docs.rs/rungbot"

[dependencies]
rungbot-core = { path = "../rungbot-core", version = "0.5.5" }
rungbot-notify = { path = "../rungbot-notify", version = "0.5.5" }
serde = { workspace = true }
serde_json = { workspace = true }
# rustls with bundled webpki roots: one static binary, no system cert store to find.
minreq = { version = "3", features = ["https-rustls"] }
