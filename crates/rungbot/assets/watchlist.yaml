# rungbot — a dip-buy / take-profit ladder, notify-only.
#
# `pair` is the venue's own symbol: Binance BTCUSDT, Gate BTC_USDT, Revolut X BTC/USD,
# CoinGecko bitcoin.
# `entry` is your cost basis. Leave it out and the coin is watched for dips only —
# rungbot will not suggest selling something it has no basis for.

bands:
  first_pct: 10        # first rung fires at a 10% move
  step_pct: 5          # every further rung, 5% beyond the last

ladder:
  min_trade_pct: 1     # don't bother with a trade smaller than this
  min_core_pct: 20     # never sell below this much of the position
  window_hours: 24     # after acting, a coin is locked to that direction this long
  buy_floor_pct: 50    # stop dip-buying past a 50% daily drop (falling knife)
  target_pct: 10       # take-profit target shown in the report
  breaker_pct: 40      # freeze dip-buys on a coin 40% underwater...
  breaker_days: 7      # ...for 7 straight days
  trail: off           # off = fire each rung on the way up; on = trail the peak

# --- Steering (optional) -------------------------------------------------------
# Reading the market costs one candle request per coin, so it only runs when a
# `sellpolicy:` is configured or you pass `--steer`.

regime:
  run_min_signals: 3   # how many of the four strength signals make a coin "running"
  run_ret30_min: 25    # the 30-day return, in percent, that counts as strong

# The bull sell policy: in a confirmed bull the ladder sells far too early, so the
# sell side of a coin with a cost basis is handed to this instead. Uncommenting it
# also turns steering on for every `plan`, at a candle request per coin. Leave it off
# and use `--steer` when you want the market read.
# sellpolicy:
#   core_pct: 20          # never sold by the policy
#   tranches: 4,8,16,32   # sell a slice the first time price reaches each multiple
#   tranche_pct: 20
#   trail_arm_mult: 2     # the trail arms at 2x cost
#   giveback_pct: 40      # first hit: this far below the running peak
#   giveback_next_pct: 20 # after a hit lands, the fall is confirmed
#   armed_giveback_pct: 15
#   # no_base_trail: BTC  # coins that only exit on an explicit --armed

# --- Research screen (optional) ------------------------------------------------
# `rungbot research` looks for coins that are deeply off their high AND earn real
# fees. Value first, then dislocation: 90% off an all-time high means nothing if
# there was never a business there. Research only; never wired to the ladder.

research:
  min_rank: 40          # skip the mega-caps: too efficiently priced
  max_rank: 600
  min_vol_24h: 500000   # you cannot trade what has no book
  min_drawdown_pct: 40  # a mild dip is not a dislocation
  max_drawdown_pct: 92  # past this it is the graveyard, not the bargain bin
  fee_floor_30d: 50000  # 30d fees at or above this count as a real business
  limit: 10
  # The weekly pipeline (`rungbot research <stage>`, see `rungbot research help`):
  # dir: ~/.local/state/rungbot/research   # ledger + indexes
  # theses: ~/.config/rungbot/theses.yaml  # `rungbot research theses --example`
  # llm:                                   # no default: the LLM stages refuse without it
  #   command: "your-llm-cli --print"      # prompt on stdin, answer on stdout
  #   max_budget_usd: 0.10                 # always appended as --max-budget-usd 0.10
  # email:                                 # key from RESEND_API_KEY
  #   from: research@example.com
  #   to: you@example.com
  # notes:                                 # token from TICKTICK_TOKEN
  #   project_id: "your-project-id"

# --- Notifications (optional) --------------------------------------------------
# The Telegram bot token is read from RUNGBOT_TELEGRAM_TOKEN, never from this file.
# notify:
#   webhook_url: https://example.com/hook
#   telegram_chat_id: "123456789"
#   email:                        # used by `rungbot watch`; key from RESEND_API_KEY
#     from: rungbot@example.com
#     to: you@example.com
#   telegram:
#     chat_id: "123456789"        # token from RUNGBOT_TELEGRAM_TOKEN

# --- Watchers (optional, for `rungbot watch`) -----------------------------------
# Read-only: they mail you, they never place or cancel anything.
# watch:
#   state_dir: ~/.local/state/rungbot
#   journal: ~/.local/state/rungbot/journal.json    # rungbot-exec's order journal
#   balances: ~/.local/state/rungbot/balances.json  # {"ts": ..., "venues": {...}}
#   btc:
#     alert_usd: 50000        # the price that flips your thesis; 0 disables
#     warn_usd: 55000         # a heads-up above it; 0 disables
#   zone:
#     stale_days: 14
#     idle_min_usd: 25
#     alts: SOL, AVAX         # coins the RUN-flip tripwire counts
#   divergence:
#     drift_band_pct: 5
#     floor_margin_pct: 3
#     min_days: 7

coins:
  BTC:
    name: Bitcoin
    venue: binance
    pair: BTCUSDT
    entry: 61000        # your cost basis, so the sell side has something to measure
  ETH:
    name: Ethereum
    venue: gate         # Gate pairs use an underscore
    pair: ETH_USDT
                        # no entry: watched for dips only, never suggested as a sell
  # Revolut X (EEA/UK) uses a slash, and one request covers every Revolut pair:
  # BTC:
  #   venue: revx
  #   pair: BTC/USD
