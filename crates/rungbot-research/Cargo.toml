[package]
name = "rungbot-research"
description = "Weekly research for rungbot: a dislocation scan, a value index, a catalyst and survivor pass through an LLM command you name, an unlock calendar, and a regime-driven report by email. Holds no venue key and never trades."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["crypto", "research", "screener", "defillama", "llm"]
categories = ["finance", "command-line-utilities"]
documentation = "https://docs.rs/rungbot-research"

[dependencies]
rungbot-notify = { path = "../rungbot-notify", version = "0.5.6" }
# rustls with bundled webpki roots, like the rest of the workspace.
minreq = { version = "3", features = ["https-rustls"] }
# Only for the local calendar date; the report is dated in local time.
chrono = { version = "0.4.38", default-features = false, features = ["clock", "std"] }
