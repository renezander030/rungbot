[package]
name = "rungbot-notify"
description = "Notifications for rungbot: email through the Resend HTTP API, Telegram and a webhook, with signal-notice dedupe. Holds no venue key and signs nothing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["crypto", "notifications", "telegram", "email", "webhook"]
categories = ["finance", "email"]
documentation = "https://docs.rs/rungbot-notify"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
minreq = { version = "3", features = ["https-rustls"] }
