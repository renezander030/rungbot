[package]
name = "rungbot-exec"
description = "Live order execution for rungbot: idempotent order journal, hard caps and a Gate.io spot client. Opt-in, GTC limit orders only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["crypto", "trading", "exchange", "gateio", "orders"]
categories = ["finance", "api-bindings"]
documentation = "https://docs.rs/rungbot-exec"

[dependencies]
rungbot-core = { path = "../rungbot-core", version = "0.5.2" }
serde = { workspace = true }
serde_json = { workspace = true }
minreq = { version = "3", features = ["https-rustls"] }
hmac = "0.12"
sha2 = "0.10"
