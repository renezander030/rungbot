[package]
name = "rungbot-core"
description = "Spot crypto ladder strategy as pure logic: dip-buy and take-profit rungs, market regime, bull sell policy and cycle indicators. No I/O, compiles to wasm32."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["crypto", "trading", "dca", "indicators", "wasm"]
categories = ["finance", "algorithms"]
documentation = "https://docs.rs/rungbot-core"

# Deliberately tiny, and deliberately free of anything the wasm32 target cannot take:
# no time, no filesystem, no network, no randomness. `now` is always passed in.
[dependencies]
serde = { workspace = true }

[dev-dependencies]
# float_roundtrip: the golden files hold Python floats, which must parse back exactly.
serde_json = { workspace = true, features = ["float_roundtrip"] }
