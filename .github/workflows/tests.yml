name: tests
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The ladder is pure and the tests inject their own prices: nothing here may reach a
  # venue. If a test ever forgets, the ticker layer refuses the call and the build fails.
  RUNGBOT_OFFLINE: "1"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --workspace --all-features

  # The Worker target. Built on every push so a dependency that breaks wasm is caught
  # the day it lands, not when the Worker is written.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: the core must compile to wasm32
        run: cargo build -p rungbot-core --target wasm32-unknown-unknown --release
      - name: and must not have grown an incompatible dependency
        run: cargo tree -p rungbot-core --target wasm32-unknown-unknown --edges normal

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: the real binary, end to end, offline
        run: |
          cargo build --release -p rungbot
          ./target/release/rungbot --version
          ./target/release/rungbot init --config /tmp/w.yaml
          ./target/release/rungbot plan --config /tmp/w.yaml \
            --prices tests/prices.example.json --now 1700000000
          ./target/release/rungbot plan --config /tmp/w.yaml \
            --prices tests/prices.example.json --now 1700000000 --json > /tmp/out.json
          test "$(jq -r '.buys[0].sym' /tmp/out.json)" = "BTC"

  # Every crate must be publishable on its own. Two defects shipped past review by
  # referencing files outside the package — a test fixture and the example config —
  # which packaging drops silently. `--dry-run` builds the real tarball and compiles it.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish -p rungbot-core --dry-run
      - run: cargo publish -p rungbot --dry-run
      - run: cargo publish -p rungbot-exec --dry-run
