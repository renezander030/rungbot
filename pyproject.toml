[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rungbot"
version = "0.1.0"
description = "A dip-buy / take-profit ladder for spot crypto. Notify-only: no API keys, no orders."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["crypto", "trading", "ladder", "dca", "dip-buy", "take-profit", "binance", "gate.io"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6"]

[project.scripts]
rungbot = "rungbot.cli:main"

[project.urls]
Homepage = "https://github.com/renezander030/rungbot"
Issues = "https://github.com/renezander030/rungbot/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/rungbot"]
